name: import-offers

# Fills the inbox on Render every 6 hours: the free plan sleeps the API, so the schedule
# lives here instead of inside it (docs/fase1.md). Can also be run by hand from Actions.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install just
        run: uv tool install rust-just
      - name: Import offers
        run: just import-offers
        env:
          API_URL: https://job-offer-funnel-api.onrender.com
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
