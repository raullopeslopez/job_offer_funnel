name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/openapi.json"
      - "backend/tests/support/e2e_server.py"
      - "specs/ui/**"
      - "Justfile"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/openapi.json"
      - "backend/tests/support/e2e_server.py"
      - "specs/ui/**"
      - "Justfile"
      - ".github/workflows/frontend.yml"

# A new push to the same branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install just
        run: uv tool install rust-just
      - name: Install dependencies
        run: just frontend-install
      - name: Run CI
        run: just frontend-ci
      # E2E: the API of backend/tests/support/e2e_server.py, with Postgres in Docker.
      - name: Install backend dependencies
        run: uv sync --locked
        working-directory: backend
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Run E2E
        run: just frontend-e2e
      # The traces of the failed or flaky scenarios (trace: retain-on-failure).
      - name: Upload E2E traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
