repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format
        language: system
        types: [python]
        args: [--force-exclude]
      - id: ruff-check
        name: ruff check
        entry: uv run --project backend ruff check --fix
        language: system
        types: [python]
        args: [--force-exclude]
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: biome
        name: biome check
        entry: pnpm --dir frontend exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        files: ^frontend/
        types_or: [ts, tsx, javascript, json]
