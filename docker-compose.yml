services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-funnel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-funnel}
      POSTGRES_DB: ${POSTGRES_DB:-funnel}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-funnel} -d ${POSTGRES_DB:-funnel}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Only with `--profile app` (`just up`), so `just db-up` and `just dev` keep working alone.
  api:
    profiles: ["app"]
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-funnel}:${POSTGRES_PASSWORD:-funnel}@db:5432/${POSTGRES_DB:-funnel}
      AUTH_TOKEN: ${AUTH_TOKEN:?set AUTH_TOKEN in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "${API_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The SPA built and served by nginx, which forwards /api to the API (same origin).
  web:
    profiles: ["app"]
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
