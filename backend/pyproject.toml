[project]
name = "funnel"
version = "0.1.0"
description = "Job search funnel API"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funnel"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "SIM", "RET", "ARG", "ERA", "DTZ", "PT", "TID", "C90", "PL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 3

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0913", "PLR0917"]  # pytest injects fixtures by name

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = ["src", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["testcontainers.*", "pytest_bdd.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib"]
filterwarnings = ["error"]
bdd_features_base_dir = "../specs"
markers = [
    "unit: pure logic, no database or network",
    "integration: repositories, queries and jobs against Postgres",
    "bdd: Gherkin scenarios end-to-end over HTTP",
    "migrations: Alembic upgrade/downgrade round trip and model drift",
    "contract: generated OpenAPI matches the versioned openapi.json",
]

[tool.importlinter]
root_package = "funnel"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core does not depend on modules"
type = "forbidden"
source_modules = ["funnel.core"]
forbidden_modules = ["funnel.modules"]

[[tool.importlinter.contracts]]
name = "applications layers"
type = "layers"
containers = ["funnel.modules.applications"]
layers = ["router", "service", "repository", "models", "domain"]

[[tool.importlinter.contracts]]
name = "applications domain is framework-free"
type = "forbidden"
source_modules = ["funnel.modules.applications.domain"]
forbidden_modules = ["fastapi", "starlette", "pydantic", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "companies layers"
type = "layers"
containers = ["funnel.modules.companies"]
layers = ["router", "service", "repository", "models"]

[[tool.importlinter.contracts]]
name = "metrics layers"
type = "layers"
containers = ["funnel.modules.metrics"]
layers = ["router", "queries", "schemas"]

[[tool.importlinter.contracts]]
name = "modules are independent (relax to service-only access when one needs another)"
type = "independence"
modules = ["funnel.modules.applications", "funnel.modules.companies", "funnel.modules.metrics"]
# The stage and channel enums are the vocabulary metrics reports in.
ignore_imports = ["funnel.modules.metrics.** -> funnel.modules.applications.domain"]

[dependency-groups]
dev = [
    "filelock>=4.2.9",
    "httpx2>=2.16.0",
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-bdd>=9.0.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
    "testcontainers[postgres]>=4.15.0",
]
